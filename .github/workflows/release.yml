name: Release

# Releases are dispatch-only. There is intentionally no `push: tags` trigger:
# the release workflow is the SOURCE of tags, not a consumer.
#
# GitHub Release only for now: the flat jar asset (quickgif-neoforge-<v>.jar) is what the
# shared bh679 Ivy repo resolves. Modrinth / CurseForge uploads come once the listings exist.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create + release (e.g. v0.1.0). Must match mod_version in gradle.properties."
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Verify input tag matches mod_version on main
        run: |
          TAG="${RELEASE_TAG#v}"
          GRADLE_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "$GRADLE_VERSION" ]; then
            echo "::error::Input tag $RELEASE_TAG does not match mod_version=$GRADLE_VERSION on main."
            exit 1
          fi
          echo "MOD_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

      - name: Check tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Pre-1.0 versions are pre-releases
        id: release_type
        run: |
          MAJOR="${RELEASE_TAG#v}"; MAJOR="${MAJOR%%.*}"
          if [ "$MAJOR" -gt 0 ] 2>/dev/null; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - run: ./gradlew build --no-daemon

      - name: Stage the NeoForge jar for release
        run: |
          mkdir -p release-artifacts
          cp build/libs/quickgif-neoforge-${MOD_VERSION}.jar release-artifacts/
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Quick GIF ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-artifacts/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
